version: 1.1.5

cache: true

interface:

  modelSelect: true

modelSpecs:

  enforce: false

  prioritize: true

  addedEndpoints:

    - Scaleway

    - agents

  fileConfig:
    legacyFileUploadUX: true

  list:

    - name: "rapide"

      label: "Rapide et économique"

      description: "Mistral Small : tâches simples et brouillons."

      default: true

      preset:

        endpoint: "Scaleway"

        model: "mistral-small-3.2-24b-instruct-2506"

    - name: "puissant"

      label: "Puissant"

      description: "Le plus gros modèle de la liste Scaleway. Plus cher."

      preset:

        endpoint: "Scaleway"

        model: "qwen3.5-397b-a17b"

endpoints:

  custom:

    - name: "Scaleway"

      apiKey: "${SCALEWAY_API_KEY}"

      baseURL: "https://api.scaleway.ai/v1"

      models:

        default: ["mistral-small-3.2-24b-instruct-2506"]

        fetch: true

      titleConvo: true

      titleModel: "mistral-small-3.2-24b-instruct-2506"

      modelDisplayLabel: "Scaleway"

webSearch:

  tavilyApiKey: "${TAVILY_API_KEY}"

  searchProvider: "tavily"

  scraperProvider: "tavily"

  rerankerType: "none"
